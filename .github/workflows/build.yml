name: Build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0'
      - run: sh preflight.sh
      - uses: gradle/actions/setup-gradle@v4
      - run: sh gradlew :app:assembleRelease :app:testDebugUnitTest --no-daemon
      - run: python3 scripts/verify_apk.py app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RearMusic-release-unsigned
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/
            app/build/reports/tests/testDebugUnitTest/
